<title>Daytale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>try{if(localStorage.getItem('daytale.appTheme')==='dark') document.documentElement.classList.add('saved-app-dark')}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
/* ============================================================
   DAYTALE — interactive design prototype
   Sakura Morning: light workspace, warm app palette.
   ============================================================ */

:root{
  --c-bg:var(--color-shell-paper);
  --c-bg-2:var(--color-shell-surface);
  --c-surface:var(--color-shell-surface);
  --c-text:var(--color-shell-ink);
  --c-muted:var(--color-shell-muted);
  --c-faint:var(--color-shell-faint);
  --c-line:var(--color-shell-line);
  --c-line-soft:var(--color-shell-line-soft);
  --c-brand:var(--color-app-cherry);
  --c-shadow:var(--shadow-soft);
  --c-phone-shadow:var(--shadow-device);

  --a-bg:var(--color-app-paper);
  --a-bg-2:var(--color-app-sakura-mist);
  --a-surface:var(--color-app-surface);
  --a-text:var(--color-app-ink);
  --a-muted:var(--color-app-muted);
  --a-faint:var(--color-app-faint);
  --a-line:var(--color-app-line);
  --a-sun:var(--color-app-sun);
  --a-sun-deep:var(--color-app-sun-deep);
  --a-rec:var(--color-app-recording);
  --a-rec-soft:var(--color-app-recording-soft);
  --a-pause:var(--color-app-pause);
  --a-pause-soft:var(--color-app-pause-soft);
  --a-sprout:var(--color-app-leaf);
  --a-sprout-soft:var(--color-app-leaf-soft);
  --a-cheek:var(--color-app-cheek);
  --a-ink-soft:var(--color-app-ink-soft);
  --a-shadow:var(--shadow-soft);
  --a-r-card:var(--radius-card);
  --a-r-btn:var(--radius-control);

  --f-display:var(--font-display);
  --f-ui:var(--font-ui);
  --f-read:var(--font-read);
  --f-mono:var(--font-mono);
}
.phone[data-app-theme="dark"],.saved-app-dark .phone{
  color-scheme:dark;
  --a-bg:var(--color-app-paper);
  --a-bg-2:var(--color-app-sakura-mist);
  --a-surface:var(--color-app-surface);
  --a-text:var(--color-app-ink);
  --a-muted:var(--color-app-muted);
  --a-faint:var(--color-app-faint);
  --a-line:var(--color-app-line);
  --a-sun:var(--color-app-sun);
  --a-sun-deep:var(--color-app-sun-deep);
  --a-rec:var(--color-app-recording);
  --a-rec-soft:var(--color-app-recording-soft);
  --a-pause:var(--color-app-pause);
  --a-pause-soft:var(--color-app-pause-soft);
  --a-sprout:var(--color-app-leaf);
  --a-sprout-soft:var(--color-app-leaf-soft);
  --a-cheek:var(--color-app-cheek);
  --a-ink-soft:var(--color-app-ink-soft);
  --a-shadow:var(--shadow-soft);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--c-bg);
  color:var(--c-text);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--c-brand);outline-offset:2px;border-radius:6px}
.eyebrow{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-faint);
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 20px;
  background:color-mix(in srgb, var(--c-bg) 86%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--c-line);
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--c-muted)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tgl{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border:1px solid var(--c-line);border-radius:999px;
  background:var(--c-surface);font-size:12.5px;font-weight:500;color:var(--c-muted);
  transition:border-color .16s, color .16s, background .16s;
}
.tgl:hover{border-color:var(--c-faint);color:var(--c-text)}
.tgl[aria-pressed="true"]{border-color:var(--c-brand);color:var(--c-brand);background:color-mix(in srgb,var(--c-brand) 9%, var(--c-surface))}
.tgl .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35}
.tgl[aria-pressed="true"] .dot{opacity:1}

/* ---------- workspace grid ---------- */
.work{
  display:grid;
  grid-template-columns:238px minmax(0,1fr) 296px;
  gap:24px;
  align-items:start;
  max-width:1420px;margin:0 auto;
  padding:24px 20px 8px;
}
@media (max-width:1180px){ .work{grid-template-columns:214px minmax(0,1fr)} .rail{grid-column:1/-1} }
@media (max-width:820px){ .work{grid-template-columns:minmax(0,1fr);gap:18px} }

/* ---------- screen index ---------- */
.index{position:sticky;top:96px}
@media (max-width:820px){ .index{position:static} }
.idx-group{margin-bottom:16px}
.idx-group h4{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-faint);margin:0 0 7px 10px;
}
.idx-list{display:flex;flex-direction:column;gap:1px}
@media (max-width:820px){
  .index{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  .idx-group{margin:0;flex:0 0 auto}
  .idx-list{flex-direction:row;gap:6px}
}
.idx{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--c-muted);
  white-space:nowrap;transition:background .14s,color .14s;
}
.idx:hover{background:var(--c-line-soft);color:var(--c-text)}
.idx .n{font-family:var(--f-mono);font-size:10.5px;color:var(--c-faint);min-width:16px}
.idx[aria-current="true"]{background:var(--c-surface);color:var(--c-text);font-weight:600;box-shadow:var(--c-shadow)}
.idx[aria-current="true"] .n{color:var(--c-brand)}

/* ---------- stage ---------- */
.stage{
  display:grid;place-items:center;
  padding:22px 8px 30px;
  border-radius:24px;
  background:var(--c-bg-2);
  border:1px solid var(--c-line-soft);
}

/* ---------- phone frame ---------- */
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{
  position:relative;
  width:356px;height:732px;
  background:var(--a-bg);
  border-radius:52px;
  padding:14px;
  box-shadow:var(--c-phone-shadow);
  background-image:none;
}
.phone::before{ /* side buttons */
  content:"";position:absolute;left:-3px;top:150px;width:3px;height:56px;border-radius:3px 0 0 3px;
  background:var(--color-shell-line);
}
.screen{
  position:relative;width:100%;height:100%;overflow:hidden;
  border-radius:40px;
  background:var(--a-bg);
  color:var(--a-text);
  display:flex;flex-direction:column;
  font-family:var(--f-ui);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a-text) 7%,transparent);
}
.notch{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:118px;height:30px;background:color-mix(in srgb, var(--a-text) 94%, black);
  border-radius:16px;z-index:40;
}
.statusbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 26px 4px;font-family:var(--f-ui);font-weight:600;font-size:14.5px;
  flex:0 0 auto;position:relative;z-index:20;color:var(--a-text);
}
.statusbar .icons{display:flex;align-items:center;gap:5px}
.homebar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:120px;height:5px;border-radius:3px;background:color-mix(in srgb, var(--a-text) 30%, transparent);
  z-index:40;
}
.screen-body{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:none}
.screen-body::-webkit-scrollbar{display:none}
.pad{padding:6px 24px 24px}

/* tab bar */
.tabbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;
  padding:9px 12px calc(20px + env(safe-area-inset-bottom,0px)*0) 12px;
  border-top:1px solid var(--a-line);background:var(--a-surface);
  position:relative;z-index:20;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--a-muted);padding:4px 14px;border-radius:12px;transition:color .15s}
.tab[aria-current="true"]{color:var(--a-sun-deep)}
.tab svg{width:22px;height:22px}
.tab small{font-size:10.5px;font-weight:600}

/* device chrome caption under the phone */
.phone-caption{display:flex;align-items:center;gap:10px}
.phone-caption select{
  font:inherit;font-size:12.5px;padding:6px 10px;border-radius:10px;border:1px solid var(--c-line);
  background:var(--c-surface);color:var(--c-text);
}
.phone-nav{display:flex;gap:8px}
.navbtn{
  width:34px;height:34px;border-radius:50%;background:var(--c-surface);border:1px solid var(--c-line);
  display:grid;place-items:center;color:var(--c-muted);box-shadow:var(--c-shadow);
}
.navbtn:hover{color:var(--c-text)}
.navbtn:disabled{opacity:.35;cursor:default}

/* ---------- right rail / spec card ---------- */
.rail{position:sticky;top:96px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1180px){.rail{position:static}}
.card{
  background:var(--c-surface);border:1px solid var(--c-line);border-radius:16px;
  padding:16px 18px;box-shadow:var(--c-shadow);
}
.card h3{font-size:14px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.card p{color:var(--c-muted);font-size:13px;line-height:1.55}
.card + .card{margin-top:0}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{
  font-family:var(--f-mono);font-size:10.5px;padding:3px 8px;border-radius:7px;
  background:var(--c-line-soft);color:var(--c-muted);
}
.tag.on{background:color-mix(in srgb,var(--c-brand) 16%, var(--c-surface));color:var(--c-brand)}
.spec-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.spec-list li{display:flex;gap:8px;font-size:12.5px;color:var(--c-muted)}
.spec-list li::before{content:"→";color:var(--c-brand);flex:0 0 auto;font-weight:600}
.mascot-chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:999px;
  background:var(--a-sprout-soft);color:var(--a-sprout);font-size:12px;font-weight:600;
}
.mascot-chip svg{width:20px;height:20px}
.ui-icon{display:inline-block;flex:0 0 auto;vertical-align:-.18em}
.sakura-petals{position:absolute;inset:72px 22px auto;pointer-events:none;z-index:0;opacity:.72}
.sakura-petals i{position:absolute;display:block;width:10px;height:16px;border-radius:80% 20% 80% 20%;background:var(--color-app-blossom);transform:rotate(28deg)}
.sakura-petals i:nth-child(1){left:4%;top:12px;transform:rotate(-24deg) scale(.85)}
.sakura-petals i:nth-child(2){right:8%;top:78px;transform:rotate(44deg) scale(.7)}
.sakura-petals i:nth-child(3){left:18%;top:148px;transform:rotate(18deg) scale(.55)}

/* ============================================================
   Mascot — single SVG, parts toggled by data-state on .mascot
   ============================================================ */
.mascot{display:block;overflow:visible}
.mascot .body{fill:var(--a-sun)}
.mascot .body-shade{fill:var(--a-sun-deep);opacity:.55}
.mascot .peach-crease{stroke:var(--a-sun-deep);stroke-width:2;fill:none;stroke-linecap:round;opacity:.5}
.mascot .cheek{fill:var(--a-cheek);opacity:.75}
.mascot .sprout-stem{stroke:var(--a-sprout);stroke-width:3.4;fill:none;stroke-linecap:round}
.mascot .sprout-leaf{fill:var(--a-sprout)}
.mascot .eye{fill:var(--a-text)}
.mascot .mouth{stroke:var(--a-text);stroke-width:3;fill:none;stroke-linecap:round}
.mascot .prop{stroke:var(--a-text);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mascot .prop-fill{fill:var(--a-surface);stroke:var(--a-text);stroke-width:2.4}
.mascot .accent{fill:var(--a-rec)}
.mascot .accent2{fill:var(--a-sprout)}
.mascot .zzz{fill:var(--a-muted);font-family:var(--f-display);font-weight:600}
.mascot [data-part]{transition:opacity .15s}
/* hide all optional parts by default; state selectors below reveal them */
.mascot [data-part]{opacity:0}
.mascot[data-state="sleeping"] [data-part="eyes-closed"],
.mascot[data-state="sleeping"] [data-part="zzz"],
.mascot[data-state="sleeping"] [data-part="mouth-sleep"]{opacity:1}

.mascot[data-state="waking"] [data-part="eyes-happy"],
.mascot[data-state="waking"] [data-part="mouth-smile"],
.mascot[data-state="waking"] [data-part="arm-wave"],
.mascot[data-state="waking"] [data-part="sparkle"]{opacity:1}

.mascot[data-state="ready"] [data-part="eyes-open"],
.mascot[data-state="ready"] [data-part="mouth-smile"],
.mascot[data-state="ready"] [data-part="cheeks"]{opacity:1}

.mascot[data-state="listening"] [data-part="eyes-happy"],
.mascot[data-state="listening"] [data-part="mouth-smile-sm"],
.mascot[data-state="listening"] [data-part="headphones"],
.mascot[data-state="listening"] [data-part="pulse"]{opacity:1}

.mascot[data-state="paused"] [data-part="eyes-soft"],
.mascot[data-state="paused"] [data-part="mouth-flat"],
.mascot[data-state="paused"] [data-part="headphones-down"]{opacity:1}

.mascot[data-state="thinking"] [data-part="eyes-up"],
.mascot[data-state="thinking"] [data-part="mouth-flat"],
.mascot[data-state="thinking"] [data-part="question"]{opacity:1}

.mascot[data-state="writing"] [data-part="eyes-open"],
.mascot[data-state="writing"] [data-part="mouth-focus"],
.mascot[data-state="writing"] [data-part="notebook"]{opacity:1}

.mascot[data-state="celebrating"] [data-part="eyes-happy"],
.mascot[data-state="celebrating"] [data-part="mouth-grin"],
.mascot[data-state="celebrating"] [data-part="confetti"],
.mascot[data-state="celebrating"] [data-part="arm-up"]{opacity:1}

.mascot[data-state="error"] [data-part="eyes-worried"],
.mascot[data-state="error"] [data-part="mouth-flat"],
.mascot[data-state="error"] [data-part="sweat"]{opacity:1}

/* idle motion — subtle breathing loop, per PRD §8 (3-6s, low amplitude) */
.mascot-fx{animation:breathe 4.4s ease-in-out infinite}
.mascot[data-state="listening"] .mascot-fx{animation-duration:2.1s}
.mascot[data-state="thinking"] .mascot-fx{animation-duration:1.7s}
.mascot[data-state="writing"] .mascot-fx{animation-duration:1.5s}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.012)}}
.mascot[data-state="celebrating"] .mascot-fx{animation:bounce-once .9s cubic-bezier(.34,1.56,.64,1)}
@keyframes bounce-once{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-14px) scale(1.05,.96)}60%{transform:translateY(0) scale(.97,1.03)}100%{transform:translateY(0) scale(1)}}
[data-part="pulse"] circle{animation:pulse-ring 2s ease-out infinite}
@keyframes pulse-ring{0%{r:34;opacity:.5}100%{r:50;opacity:0}}
[data-part="confetti"] rect{animation:confetti-fall 1.1s ease-in forwards}
@keyframes confetti-fall{0%{transform:translateY(-6px) rotate(0);opacity:1}100%{transform:translateY(14px) rotate(70deg);opacity:0}}
[data-part="zzz"]{animation:zzz-float 3s ease-in-out infinite}
@keyframes zzz-float{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-4px);opacity:1}}

body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after{
  animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;
}

/* ============================================================
   Reusable app components (inside the phone)
   ============================================================ */
.h-mascot-slot{display:flex;justify-content:center;padding:10px 0 4px}
.a-eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--a-muted)}
.a-h1{font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.01em;color:var(--a-text)}
.a-sub{font-size:13.5px;color:var(--a-muted);line-height:1.5}
.a-card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:var(--a-r-card);padding:16px;box-shadow:var(--a-shadow)}
.a-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:var(--a-r-btn);
  font-family:var(--f-ui);font-weight:700;font-size:15px;
  transition:transform .1s;
}
.a-btn:active{transform:scale(.97)}
.a-btn-primary{background:var(--color-app-cherry);color:var(--color-app-paper);box-shadow:none}
.a-btn-ghost{background:var(--a-surface);color:var(--a-text);border:1.5px solid var(--a-line)}
.a-btn-text{color:var(--a-muted);font-weight:600;font-size:13.5px;padding:8px}
.a-btn-danger{background:var(--a-rec-soft);color:var(--a-rec)}
.a-stack{display:flex;flex-direction:column;gap:10px}
.a-row{display:flex;align-items:center;gap:10px}
.a-chip{
  min-height:44px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--a-line);font-weight:600;font-size:13px;
  color:var(--a-text);background:var(--a-surface);transition:all .13s;
}
.a-chip[aria-pressed="true"]{background:var(--color-app-sakura-mist);color:var(--color-app-cherry-hover);border-color:var(--color-app-cherry)}
.a-chip.small{padding:6px 12px;font-size:12px}
.a-check-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 14px;border-radius:16px;border:1.5px solid var(--a-line);background:var(--a-surface);
}
.a-check-row[data-checked="true"]{border-color:var(--a-sun-deep);background:color-mix(in srgb, var(--a-sun) 12%, var(--a-surface))}
.a-check{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--a-line);flex:0 0 auto;display:grid;place-items:center;
}
.a-check-row[data-checked="true"] .a-check{background:var(--a-sun-deep);border-color:var(--a-sun-deep)}
.a-flag{font-size:19px;line-height:1}
.a-lang-name{font-weight:600;font-size:14.5px}
.a-lang-native{font-size:12px;color:var(--a-muted)}
.a-select{
  width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--a-line);
  background:var(--a-surface);color:var(--a-text);font:inherit;font-weight:600;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14'><path d='M2 4l5 5 5-5' fill='none' stroke='%23735b66' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;
}
.a-field-label{font-size:12px;font-weight:700;color:var(--a-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.a-time-card{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:var(--a-surface);border:1px solid var(--a-line)}
.a-time-card b{font-family:var(--f-display);font-size:20px;font-weight:600}
.a-days{display:flex;gap:6px;justify-content:space-between}
.a-day{
  flex:0 0 auto;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  border:1.5px solid var(--a-line);color:var(--a-muted);
}
.a-day[aria-pressed="true"]{background:var(--color-app-cherry);border-color:var(--color-app-cherry);color:var(--color-app-paper)}
.switch{width:44px;height:26px;border-radius:999px;background:var(--a-line);position:relative;flex:0 0 auto;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--a-surface);box-shadow:0 1px 3px color-mix(in srgb,var(--a-text) 25%,transparent);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--a-sprout)}

function goto(id){
  if(!SCREEN_BY_ID[id]) return;
  state.screen = id;
  const s = SCREEN_BY_ID[id];
  if(s.tab) state.tab = s.tab;
  state.history.push(id);
  render();
  const body=document.getElementById('screenBody');
  if(body) body.scrollTop = 0;
}
function setTab(tab){
  state.tab = tab;
  const map = {today: state.timerHandle ? 'recording' : 'today-idle', journal:'journal-list', settings:'settings-root'};
  goto(map[tab]);
}
function stepScreen(dir){
  const ids = SCREENS.map(s=>s.id);
  let i = ids.indexOf(state.screen) + dir;
  i = Math.max(0, Math.min(ids.length-1, i));
  goto(ids[i]);
}

/* ---------- onboarding actions ---------- */
function toggleLang(code){
  const count = activeLangs().length;
  if(state.langs[code] && count<=1) return; // keep at least one
  state.langs[code] = !state.langs[code];
  render();
}
function setJournalLang(code){ state.journalLang = code; render(); }
function setScheduleTime(which, val){ state[which] = val; render(); }
function toggleDay(d){ state.repeatDays[d] = !state.repeatDays[d]; render(); }
function toggleReminder(){ state.reminder = !state.reminder; render(); }
function finishPermissions(){
  // Permission granted: show the Ready celebration, then move on by itself —
  // no extra tap required. A visible "skip the wait" link still lets an
  // impatient user jump ahead immediately.
  goto('ready');
  clearTimeout(state.readyAutoHandle);
  state.readyAutoHandle = setTimeout(() => {
    if(state.screen === 'ready') goto('today-idle');
  }, 1700);
}

/* ---------- daily loop actions ---------- */
function startMyDay(){
  state.timerSeconds = 0; state.breakChoice = null;
  startTimerInterval();
  goto('recording');
}
function skipToday(){ goto('today-idle'); }
function pauseSession(){
  stopTimerInterval();
  goto('privacy-sheet');
}
function chooseBreak(choice){
  state.breakChoice = choice;
  goto('paused');
}
function cancelBreak(){ startTimerInterval(); goto('recording'); }
function resumeSession(){ startTimerInterval(); goto('recording'); }
function stopSession(){
  stopTimerInterval();
  state.procStage = -1;
  goto('processing');
  runProcessing();
}
function runProcessing(){
  clearTimeout(state.procHandle);
  const step=()=>{
    state.procStage++;
    render();
    if(state.procStage < PROC_STAGES.length-1){
      state.procHandle = setTimeout(step, 850);
    } else {
      state.procHandle = setTimeout(()=>{
        state.clarIndex = 0; state.clarAnswers = [];
        goto('clarification');
      }, 900);
    }
  };
  state.procHandle = setTimeout(step, 400);
}
function retryProcessing(){ state.procStage=-1; goto('processing'); runProcessing(); }
function discardSession(){ clearTimeout(state.procHandle); goto('today-idle'); }

function answerClarification(label){
  const q = CLAR_QUESTIONS[state.clarIndex];
  state.clarAnswers.push({...q, answer:label});
  if(state.clarIndex < CLAR_QUESTIONS.length-1){
    state.clarIndex++;
    render();
  } else {
    finishJournal();
  }
}
function finishJournal(){
  const chips = ['Work','Gym', ...state.clarAnswers.filter(a=>a.answer!=='Ignore').map(a=>a.answer)];
  const uniqueChips = [...new Set(chips)];
  const today = new Date();
  const entry = {
    id:'e0-'+Date.now(),
    weekday:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][today.getDay()],
    day: today.getDate(), month: today.toLocaleString('en',{month:'short'}),
    title:'A productive day',
    chips: uniqueChips,
    body:[
      "I started my day at 7:00 AM and headed to Bondi Junction, where I worked on client projects and had a great lunch with the team.",
      "In the evening, I went to the gym and completed a solid workout.",
      "Overall, it was a productive day and I felt good about it. 🙂"
    ],
  };
  state.entries.unshift(entry);
  state.currentEntryId = entry.id;
  goto('journal-ready');
}

/* ---------- timer ---------- */
function startTimerInterval(){
  if(state.timerHandle) return;
  state.timerHandle = setInterval(()=>{
    state.timerSeconds++;
    const el = document.getElementById('timerDisplay');
    if(el) el.textContent = fmtTime(state.timerSeconds);
  }, 1000);
}
function stopTimerInterval(){
  clearInterval(state.timerHandle);
  state.timerHandle = null;
}

    const text = el.innerText.replace(/\r/g,'');
    const paras = text.split(/\n{1,}/).map(p=>p.trim()).filter(Boolean);
    currentEntry().body = paras.length ? paras : currentEntry().body;
  }
  goto('journal-detail');
}

/* ============================================================
   RENDER — one dispatcher, driven entirely by `state`
   ============================================================ */
function render(){
  const cur = SCREEN_BY_ID[state.screen];

  // phone screen body
  const body = document.getElementById('screenBody');
  if(body) body.innerHTML = SCREEN_RENDER[state.screen] ? SCREEN_RENDER[state.screen]() : '';

  // tab bar: visible + active only on screens that belong to a tab
  const tabbar = document.getElementById('tabbar');
  if(tabbar){
    tabbar.hidden = !cur.tab;
    tabbar.querySelectorAll('.tab').forEach(btn=>{
      btn.setAttribute('aria-current', String(btn.dataset.tab === state.tab));
    });
  }

  // phone app theme (independent of studio chrome theme)
  const phone = document.getElementById('phoneFrame');
  if(phone) phone.setAttribute('data-app-theme', state.appTheme);
  document.documentElement.classList.toggle('saved-app-dark', state.appTheme==='dark');

  // screen picker rail highlight
  document.querySelectorAll('.idx').forEach(btn=>{
    btn.setAttribute('aria-current', String(btn.dataset.id === state.screen));
  });

  // jump select
  const jump = document.getElementById('jumpSelect');
  if(jump) jump.value = state.screen;

  // prev/next nav bounds
  const ids = SCREENS.map(s=>s.id);
  const i = ids.indexOf(state.screen);
  const prev = document.getElementById('navPrev'), next = document.getElementById('navNext');
  if(prev) prev.disabled = i<=0;
  if(next) next.disabled = i>=ids.length-1;

  // right rail spec card
  const rail = document.getElementById('rail');
  if(rail){
    const spec = SPEC[state.screen] || {note:'', wired:[]};
    rail.innerHTML = `
      <div class="card">
        <h3>${cur.group} · ${cur.label}</h3>
        <div class="mascot-chip">${mascotSVG(cur.mascot,22)} ${MASCOT_MEANING[cur.mascot] || cur.mascot}</div>
        <p style="margin-top:10px">${spec.note}</p>
        ${spec.wired && spec.wired.length ? `<ul class="spec-list">${spec.wired.map(w=>`<li>${w}</li>`).join('')}</ul>` : ''}
      </div>
      <div class="card">
        <h3>State snapshot</h3>
        <div class="tag-row">
          <span class="tag on">${activeLangs().map(l=>l.flag).join('')} spoken</span>
          <span class="tag on">journal: ${langName(state.journalLang)}</span>
          <span class="tag">${state.scheduleStart}–${state.scheduleEnd}</span>
          <span class="tag">${state.entries.length} entries</span>
        </div>
      </div>
    `;
  }

  // toggle buttons
  setTgl('tglAppTheme','tglAppThemeLabel', state.appTheme==='dark', 'Light app preview', 'Dark app preview');
  setTgl('tglMotion','tglMotionLabel', state.reducedMotion, 'Reduce motion', 'Reduce motion');
  document.body.classList.toggle('reduced-motion', state.reducedMotion);
}
function setTgl(btnId, labelId, on, onLabel, offLabel){
  const btn = document.getElementById(btnId), label = document.getElementById(labelId);
  if(btn) btn.setAttribute('aria-pressed', String(on));
  if(label) label.textContent = on ? onLabel : offLabel;
}

/* ============================================================
   TOP BAR TOGGLES
   ============================================================ */
function toggleAppTheme(){
  state.appTheme = state.appTheme==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem('daytale.appTheme', state.appTheme); }catch(e){}
  render();
}
function toggleMotion(){
  state.reducedMotion = !state.reducedMotion;
  render();
}

/* ============================================================
   INIT — build the static chrome once, then render(state.screen)
   ============================================================ */
function buildIndex(){
  const groups = [];
  SCREENS.forEach(s=>{
    let g = groups.find(g=>g.name===s.group);
    if(!g){ g = {name:s.group, items:[]}; groups.push(g); }
    g.items.push(s);
  });
  const nav = document.getElementById('index');
  nav.innerHTML = groups.map(g=>`
    <div class="idx-group">
      <h4>${g.name}</h4>
      <div class="idx-list">
        ${g.items.map((s,i)=>`<button class="idx" data-id="${s.id}" onclick="goto('${s.id}')"><span class="n">${String(i+1).padStart(2,'0')}</span>${s.label}</button>`).join('')}
      </div>
    </div>`).join('');
}
function buildJumpSelect(){
  const sel = document.getElementById('jumpSelect');
  sel.innerHTML = SCREENS.map(s=>`<option value="${s.id}">${s.group} — ${s.label}</option>`).join('');
}
function init(){
  buildIndex();
  buildJumpSelect();
  buildBoards();
  // The workspace is deliberately light-first. Only the app preview changes theme.
  document.documentElement.setAttribute('data-theme', 'light');
  document.body.classList.toggle('reduced-motion', state.reducedMotion);
  render();
}
